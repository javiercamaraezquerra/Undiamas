name: Build signed production APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main, codex/undiamas-production-v23, codex/undiamas-production-v26]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    if: >-
      github.repository == 'javiercamaraezquerra/Undiamas' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/codex/undiamas-production-v23' ||
       github.ref == 'refs/heads/codex/undiamas-production-v26')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      GRADLE_OPTS: '-Dorg.gradle.configuration-cache=false'
      # Public UPLOAD certificate verified in Play Console on 2026-09-11.
      # This is distinct from Google's certificate for the installed Play app.
      EXPECTED_UPLOAD_SHA256: 'ab60189c5e413d67b5dfbb347dd2ff4e5804ad79632af67e5ec56fe7414a2c87'

    steps:
      # SHA pins supplied in build/validation/github-action-pins.json.
      - name: Checkout approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.32.8
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install matching Android toolchain
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          sdk = pathlib.Path(os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME'])
          manager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([str(manager), '--install', 'platforms;android-36',
                          'build-tools;36.0.0', 'ndk;28.1.13356709', 'cmake;3.22.1'],
                         input='y\n' * 100, text=True, check=True)
          PY
          flutter --version
          java -version

      - name: Resolve the committed dependency lock
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test before accessing signing secrets
        run: |
          # Keep the existing warning baseline; analyzer errors still fail.
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub --reporter expanded
          python3 -m unittest discover -s tool -p '*_test.py' -v
          git diff --exit-code HEAD -- lib assets android test tool pubspec.yaml pubspec.lock .github

      - name: Prepare the existing upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib
          names = ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('All four existing signing secrets are required; no debug fallback.')
          store = pathlib.Path(os.environ['RUNNER_TEMP']) / 'undiamas-signing.jks'
          properties = pathlib.Path('android/key.properties')
          if store.exists() or properties.exists():
              raise SystemExit('Unexpected pre-existing signing files; refusing to overwrite.')
          data = base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True)
          if not data:
              raise SystemExit('The signing keystore is empty.')
          with store.open('xb') as output:
              output.write(data)
          # Encode Java Properties values safely, including Unicode passwords.
          def escaped(value):
              raw = value.encode('utf-16-be')
              return ''.join('\\u%04x' % int.from_bytes(raw[i:i+2], 'big')
                             for i in range(0, len(raw), 2))
          values = {'storeFile': str(store), 'storePassword': os.environ['STORE_PASSWORD'],
                    'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          with properties.open('x', encoding='ascii') as output:
              output.write(''.join(key + '=' + escaped(value) + '\n' for key, value in values.items()))
          PY
          # Export only the PUBLIC certificate; passwords never enter argv.
          keytool -exportcert -keystore "$RUNNER_TEMP/undiamas-signing.jks" \
            -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD \
            -file "$RUNNER_TEMP/undiamas-signing.der"
          python3 - <<'PY'
          import hashlib, os, pathlib
          certificate = pathlib.Path(os.environ['RUNNER_TEMP']) / 'undiamas-signing.der'
          if hashlib.sha256(certificate.read_bytes()).hexdigest() != os.environ['EXPECTED_UPLOAD_SHA256']:
              raise SystemExit('The configured keystore does not match the verified Play upload certificate.')
          PY

      - name: Build signed production artifacts
        run: |
          flutter build appbundle --release --flavor production --no-pub --dart-define=UDM_PREVIEW=false
          flutter build apk --release --flavor production --no-pub --dart-define=UDM_PREVIEW=false

      - name: Verify native photo policy with the existing Kotlin compiler
        run: |
          # The preceding Android build resolves the same Kotlin 1.9.22
          # compiler used locally. No extra SDK or compiler is installed.
          python3 - <<'PY'
          import os, pathlib, subprocess
          cache = pathlib.Path(os.environ.get('GRADLE_USER_HOME', str(pathlib.Path.home() / '.gradle')))
          cache = cache / 'caches/modules-2/files-2.1'
          def jar(group, artifact, version):
              matches = list((cache / group / artifact / version).glob(f'*/{artifact}-{version}.jar'))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one resolved dependency: {group}:{artifact}:{version}')
              return str(matches[0])
          stdlib = jar('org.jetbrains.kotlin', 'kotlin-stdlib', '1.9.22')
          compiler = os.pathsep.join([
              jar('org.jetbrains.kotlin', 'kotlin-compiler-embeddable', '1.9.22'),
              stdlib,
              jar('org.jetbrains.kotlin', 'kotlin-script-runtime', '1.9.22'),
              jar('org.jetbrains.kotlin', 'kotlin-reflect', '1.6.10'),
              jar('org.jetbrains.intellij.deps', 'trove4j', '1.0.20200330'),
              jar('org.jetbrains', 'annotations', '13.0'),
          ])
          output = pathlib.Path('build/validation')
          classes = output / 'native-photo-policy-ci-classes'
          classes.mkdir(parents=True, exist_ok=True)
          commands = [
              ['java', '-cp', compiler, 'org.jetbrains.kotlin.cli.jvm.K2JVMCompiler',
               '-no-stdlib', '-no-reflect', '-jvm-target', '17', '-classpath', stdlib,
               '-d', str(classes),
               'android/app/src/main/kotlin/com/celsoriaapps/undiamas/PhotoImportPolicy.kt',
               'tool/native_photo_policy_test.kt'],
              ['java', '-cp', os.pathsep.join([str(classes), stdlib]),
               'com.celsoriaapps.undiamas.Native_photo_policy_testKt'],
          ]
          with (output / 'native-photo-policy-ci.txt').open('w', encoding='utf-8') as log:
              for command in commands:
                  result = subprocess.run(command, stdout=subprocess.PIPE,
                                          stderr=subprocess.STDOUT, text=True, encoding='utf-8')
                  log.write(result.stdout)
                  log.flush()
                  print(result.stdout, end='')
                  result.check_returncode()
          PY

      - name: Verify identity, signatures and provenance
        run: |
          git diff --exit-code HEAD -- lib assets android test tool pubspec.yaml pubspec.lock .github
          python3 tool/verify_release.py \
            --apk build/app/outputs/flutter-apk/app-production-release.apk \
            --aab build/app/outputs/bundle/productionRelease/app-production-release.aab \
            --certificate "$RUNNER_TEMP/undiamas-signing.der" \
            --expected-upload-sha256 "$EXPECTED_UPLOAD_SHA256" \
            --output build/validation/production-release.json
          test -s build/app/outputs/mapping/productionRelease/mapping.txt
          sha256sum build/app/outputs/flutter-apk/app-production-release.apk \
            build/app/outputs/bundle/productionRelease/app-production-release.aab \
            build/app/outputs/mapping/productionRelease/mapping.txt \
            > build/validation/production-sha256.txt
          cat build/validation/production-sha256.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Always remove private signing material
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/undiamas-signing.jks" \
            "$RUNNER_TEMP/undiamas-signing.der" android/key.properties

      - name: Upload verified artifacts only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: undiamas-production-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-production-release.apk
            build/app/outputs/bundle/productionRelease/app-production-release.aab
            build/app/outputs/mapping/productionRelease/mapping.txt
            build/validation/production-release.json
            build/validation/production-sha256.txt
            build/validation/native-photo-policy-ci.txt
